name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Same major as the Node that writes package-lock.json.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      # next typegen creates the PageProps types; tsc fails on a clean checkout without it.
      - run: npm run typecheck
      - run: npm run build

  # Proves the image Cloud Run will run actually builds.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t fairbid:ci .

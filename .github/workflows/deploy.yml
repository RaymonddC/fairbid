name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Rebuild the demo tender after migrating"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation, so no exported key

# Queue instead of cancel: stopping mid-migration could leave things half-applied.
concurrency:
  group: fairbid-production
  cancel-in-progress: false

env:
  REGION: asia-southeast1
  SERVICE: fairbid
  REPO: fairbid

jobs:
  # Skips, rather than fails, until the GCP secrets exist. See DEPLOY.md.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
          MIGRATION_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ -n "$PROJECT" ] && [ -n "$PROVIDER" ] && [ -n "$DEPLOY_SA" ] && [ -n "$MIGRATION_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP secrets are not set, so the deploy was skipped. See DEPLOY.md."
          fi

  migrate:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      PROXY_VERSION: v2.14.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      # The database takes no direct connections, so migrations go through the
      # Cloud SQL proxy, which signs in as the deployer.
      - name: Start Cloud SQL proxy
        run: |
          curl -fsSL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${{ vars.SQL_CONNECTION }}" > proxy.log 2>&1 &
          for _ in $(seq 30); do
            grep -q "ready for new connections" proxy.log && exit 0
            sleep 1
          done
          cat proxy.log
          exit 1
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - if: ${{ inputs.seed }}
        run: npx prisma db seed

  deploy:
    needs: [check, migrate]
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${{ github.sha }}"
          docker build -t "$IMAGE" --build-arg NEXT_PUBLIC_PAYPAL_CLIENT_ID="${{ vars.PAYPAL_CLIENT_ID }}" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          flags: >-
            --allow-unauthenticated
            --service-account=fairbid-run@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --min-instances=${{ vars.MIN_INSTANCES || 0 }} --max-instances=3
            --concurrency=40 --memory=512Mi --cpu-boost
            --add-cloudsql-instances=${{ vars.SQL_CONNECTION }}
            --set-env-vars=PAYPAL_ENV=sandbox,PAYPAL_CLIENT_ID=${{ vars.PAYPAL_CLIENT_ID }},PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }},ANTHROPIC_MODEL=${{ vars.ANTHROPIC_MODEL }},PAYPAL_WEBHOOK_ID=${{ vars.PAYPAL_WEBHOOK_ID }}
            --set-secrets=DATABASE_URL=fairbid-database-url:latest,SESSION_SECRET=fairbid-session-secret:latest,PAYPAL_SECRET=fairbid-paypal-secret:latest
      - run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
